name: Generate Rudra monthly charts
on:
  push:
    branches: [main]
    paths:
      - 'NQ/tools/make_rudra_reversal_monthly_review_charts.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy matplotlib
      - run: python3 NQ/tools/make_rudra_reversal_monthly_review_charts.py
      - name: Commit charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NQ/reports/rudra_reversal_1y_monthly
          git diff --cached --quiet || git commit -m "Generate Rudra-Reversal monthly review charts"
          git push
